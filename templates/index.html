<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cafe Portal</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body class="dark-bg">

<div class="login-box">

    <p class="sub-title">
        PERSONAL PORTAL
    </p>

    <h1 class="main-logo">
        KAITO
    </h1>

    <form method="POST">

        <input
            type="text"
            name="username"
            placeholder="USERNAME"
            class="form-control mb-3"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="PASSWORD"
            class="form-control mb-4"
            required
        >

        <button class="btn btn-primary w-100">

            ENTER

        </button>

    </form>

</div>

</body>
</html>
