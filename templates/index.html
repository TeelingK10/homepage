<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cafe Portfolio</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark custom-nav">

    <div class="container">

        <a class="navbar-brand logo">
            CAFE KAITO
        </a>

        <a href="/login" class="btn cafe-btn">
            Login
        </a>

    </div>

</nav>

<section class="hero-section">

    <div class="hero-content container">

        <p class="sub-title">
            RELAX × CREATE × ENGINEER
        </p>

        <h1>
            Cozy
            <span>Cafe</span>
            Space
        </h1>

        <p class="hero-text">

            落ち着いたカフェのような空間で、
            自分専用システムを管理するポータルサイト。

        </p>

        <a
            href="/login"
            class="btn hero-btn btn-lg"
        >
            ENTER
        </a>

    </div>

</section>

<section class="concept-section container">

    <div class="row align-items-center g-5">

        <div class="col-lg-6">

            <img
                src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?q=80&w=1974&auto=format&fit=crop"
                class="concept-img"
            >

        </div>

        <div class="col-lg-6">

            <p class="section-subtitle">
                PERSONAL SPACE
            </p>

            <h2 class="section-title">
                Calm & Modern
            </h2>

            <p class="section-text">

                筋トレ記録、スケジュール、
                お金管理をまとめた
                自分専用のライフダッシュボード。

            </p>

        </div>

    </div>

</section>

<section class="features container">

    <div class="row g-4">

        <div class="col-md-4">

            <div class="feature-card">

                <h3>
                    Training
                </h3>

                <p>
                    筋トレ管理システム
                </p>

            </div>

        </div>

        <div class="col-md-4">

            <div class="feature-card">

                <h3>
                    Money
                </h3>

                <p>
                    お金管理システム
                </p>

            </div>

        </div>

        <div class="col-md-4">

            <div class="feature-card">

                <h3>
                    Schedule
                </h3>

                <p>
                    カレンダー管理
                </p>

            </div>

        </div>

    </div>

</section>

</body>
</html>
