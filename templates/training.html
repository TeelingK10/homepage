<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Training System
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body class="gym-body">

<div class="gym-sidebar">

    <h2>
        TRAINING
    </h2>

    <a href="/dashboard">
        Dashboard
    </a>

    <a href="/training">
        Workout
    </a>

    <a href="/money">
        Money
    </a>

    <a href="/schedule">
        Schedule
    </a>

    <a href="/logout" class="gym-logout">
        Logout
    </a>

</div>

<div class="gym-main">

    <div class="gym-hero">

        <p>
            NO EXCUSES
        </p>

        <h1>
            Gym Dashboard
        </h1>

        <span>
            Track Your Progress
        </span>

    </div>

    <!-- Add Workout -->

    <div class="add-workout-box">

        <h2>
            Add Workout
        </h2>

        <form
            method="POST"
            action="/add_workout"
        >

            <input
                type="text"
                name="exercise"
                placeholder="Exercise"
                required
            >

            <input
                type="text"
                name="weight"
                placeholder="Weight"
                required
            >

            <input
                type="text"
                name="reps"
                placeholder="Reps"
                required
            >

            <input
                type="text"
                name="sets"
                placeholder="Sets"
                required
            >

            <button>
                Add
            </button>

        </form>

    </div>

    <!-- Workout List -->

    <div class="workout-grid">

        {% for workout in workouts %}

        <div class="workout-card">

            <h3>
                {{ workout.exercise }}
            </h3>

            <div class="workout-info">

                <div>

                    <span>
                        Weight
                    </span>

                    <h4>
                        {{ workout.weight }}
                    </h4>

                </div>

                <div>

                    <span>
                        Reps
                    </span>

                    <h4>
                        {{ workout.reps }}
                    </h4>

                </div>

                <div>

                    <span>
                        Sets
                    </span>

                    <h4>
                        {{ workout.sets }}
                    </h4>

                </div>

            </div>

            <a
                href="/delete_workout/{{ workout.id }}"
                class="delete-btn"
            >
                Delete
            </a>

        </div>

        {% endfor %}

    </div>

</div>

</body>
</html>
