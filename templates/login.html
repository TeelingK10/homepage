<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="dark-bg">

<div class="login-box">
    <h2>Login</h2>

    <form method="POST">
        <input type="text" name="username" placeholder="ユーザー名" class="form-control mb-3" required>

        <input type="password" name="password" placeholder="パスワード" class="form-control mb-3" required>

        <button class="btn btn-primary w-100">ログイン</button>
    </form>
</div>

</body>
</html>
