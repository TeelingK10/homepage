<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dashboard</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body class="dashboard-body">

<div class="sidebar">

    <h2 class="sidebar-logo">
        KAITO
    </h2>

    <a href="#">
        Home
    </a>

    <a href="#">
        Training
    </a>

    <a href="#">
        Money
    </a>

    <a href="#">
        Schedule
    </a>

    <a href="/logout" class="logout-btn">
        Logout
    </a>

</div>

<div class="main-content">

    <div class="welcome-card">

        <p class="welcome-subtitle">
            PERSONAL DASHBOARD
        </p>

        <h1>
            Welcome,
            {{ user.id }}
        </h1>

        <p>
            自分専用のライフ管理ポータル
        </p>

    </div>

    <div class="dashboard-grid">

        <div class="dashboard-card large-card">

            <h3>
                Training System
            </h3>

            <p>
                筋トレ記録・メニュー管理
            </p>

        </div>

        <div class="dashboard-card">

            <h3>
                Money
            </h3>

            <p>
                収支・固定費管理
            </p>

        </div>

        <div class="dashboard-card">

            <h3>
                Calendar
            </h3>

            <p>
                スケジュール管理
            </p>

        </div>

        <div class="dashboard-card image-card">

            <div>

                <p class="small-title">
                    CAFE MODE
                </p>

                <h2>
                    Relax & Focus
                </h2>

            </div>

        </div>

    </div>

</div>

</body>
</html>
